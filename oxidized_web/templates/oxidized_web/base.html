{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>Oxidized</title>
  <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}">

  <link rel="stylesheet" href="{% static 'weblibs/bootstrap.css' %}">
  <link rel="stylesheet" href="{% static 'weblibs/bootstrap-icons.css' %}">
  <link rel="stylesheet" href="{% static 'weblibs/dataTables.bootstrap5.css' %}">
  <link rel="stylesheet" href="{% static 'weblibs/buttons.bootstrap5.css' %}">
  <link rel="stylesheet" href="{% static 'css/oxidized.css' %}">

  <script src="{% static 'weblibs/jquery.js' %}"></script>
  <script src="{% static 'weblibs/bootstrap.bundle.js' %}"></script>
  <script src="{% static 'weblibs/dataTables.js' %}"></script>
  <script src="{% static 'weblibs/dataTables.bootstrap5.js' %}"></script>
  <script src="{% static 'weblibs/dataTables.buttons.js' %}"></script>
  <script src="{% static 'weblibs/buttons.bootstrap5.js' %}"></script>
  <script src="{% static 'weblibs/buttons.colVis.js' %}"></script>
  <script src="{% static 'weblibs/dayjs.min.js' %}"></script>
  <script src="{% static 'weblibs/dayjs-plugin-utc.min.js' %}"></script>
  <script>dayjs.extend(dayjsPluginUTC.default);</script>
  <script src="{% static 'scripts/theme-toggle.js' %}"></script>
  <style>
    .success { background-color: #28a745; width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
    .fail, .no_connection { background-color: #dc3545; width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
    .never { background-color: #6c757d; width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom border-secondary-subtle mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="/nodes">
        <img src="{% static 'images/oxidizing_40px.png' %}" alt="Logo" style="height: 28px;">
        Oxidized
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#ox-nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="ox-nav">
        <ul class="navbar-nav me-auto mb-1">
          <li class="nav-item">
            <a class="nav-link" href="/nodes">Nodes</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/nodes/stats">Stats</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/admin/" target="_blank">Django Admin (Config & router.db)</a>
          </li>
        </ul>
        <form class="d-flex" role="search" action="/nodes/conf_search" method="post">
          {% csrf_token %}
          <input class="form-control me-2" type="text" name="search_in_conf_textbox" placeholder="Search in Configs" aria-label="Search in Configs">
          <button class="btn btn-primary" type="submit">
            <i class="bi bi-search"></i>
          </button>
        </form>
        <button class="btn btn-outline-secondary ms-2" id="theme-toggle" type="button" aria-label="Toggle theme">
          <i class="bi bi-moon-fill"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    {% block content %}{% endblock %}
  </div>

  <footer class="bg-body-tertiary border-top border-secondary-subtle mt-4 py-2">
    <div class="container-fluid">
      <div class="row">
        <div class="col">
          Oxidized (Python & Django edition) &bull; PostgreSQL backend &bull; Admin enabled
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
